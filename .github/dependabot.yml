# Version updates are reviewed on dev before the dev-to-main release.
# Major upgrades are handled separately; security updates retain GitHub defaults.
version: 2
updates:
  - package-ecosystem: gomod
    # PocketBase minor upgrades need a coordinated Go/runtime review.
    ignore:
      - dependency-name: "github.com/pocketbase/pocketbase"
        update-types:
          - version-update:semver-minor
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/db"
    schedule:
      interval: "monthly"
    groups:
      gomod-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      npm-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/docs"
    schedule:
      interval: "monthly"
    groups:
      docker-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/db"
    schedule:
      interval: "monthly"
    groups:
      docker-db-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/docs"
    schedule:
      interval: "monthly"
    groups:
      docker-docs-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/search"
    schedule:
      interval: "monthly"
    groups:
      docker-search-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    target-branch: "dev"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      docker-web-backward-compatible:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
