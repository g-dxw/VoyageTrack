<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon-192x192.png?v=20261031-voyagetrack" type="image/png" sizes="192x192" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico?v=20261031-voyagetrack" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=20261031-voyagetrack" type="image/svg+xml" sizes="any" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=20261031-voyagetrack" sizes="180x180" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json?v=20261031-voyagetrack" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light">
	<script>
		const storedTheme = localStorage.theme;
		const theme =
			storedTheme === 'dark' || storedTheme === 'light'
				? storedTheme
				: window.matchMedia('(prefers-color-scheme: dark)').matches
					? 'dark'
					: 'light';
		document.documentElement.classList.add(theme);
		document.querySelector("meta[name='color-scheme']")?.setAttribute("content", theme);
	</script>
	%sveltekit.head%
</head>

<body class="w-full" data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
